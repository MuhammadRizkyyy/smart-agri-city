---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: python-ml-hpa
  namespace: agricity
  labels:
    app.kubernetes.io/name: python-ml
    app.kubernetes.io/component: hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: python-ml

  minReplicas: 1
  maxReplicas: 5

  metrics:
    # CPU Utilization — scale up jika > 70% 
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Memory Utilization — scale up jika > 80% 
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    # Scale Up: agresif — naik cepat saat beban tinggi 
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max

    # Scale Down: konservatif — turun perlahan 
    scaleDown:
      stabilizationWindowSeconds: 300   # Tunggu 5 menit sebelum scale down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min