---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: agricity
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-gateway
          image: smart-agri/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: NODE_ENV
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agricity-secrets
                  key: JWT_SECRET
            - name: OAUTH_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: OAUTH_SERVER_URL
            - name: FARMER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: FARMER_SERVICE_URL
            - name: CROP_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: CROP_SERVICE_URL
            - name: IRRIGATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: IRRIGATION_SERVICE_URL
            - name: ML_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: ML_SERVICE_URL
            - name: PYTHON_ML_URL
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: PYTHON_ML_URL
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: TZ
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

---
# Service Gateway (NodePort port 3000) 
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: agricity
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
spec:
  type: NodePort       
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300   
      protocol: TCP