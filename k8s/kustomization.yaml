
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agricity

resources:
  # 1. Namespace (harus pertama)
  - namespace.yaml

  # 2. Config & Secrets
  - configmap.yaml
  - secrets.yaml

