
#  1. PHP FARMER SERVICE (port 8000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-farmer
  namespace: agricity
  labels:
    app.kubernetes.io/name: php-farmer
    app.kubernetes.io/component: farmer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php-farmer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: php-farmer
        app.kubernetes.io/name: php-farmer
        app.kubernetes.io/component: farmer-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: php-farmer
          image: smart-agri/php-farmer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: DB_PORT
            - name: DB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: DB_DATABASE
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agricity-secrets
                  key: DB_PASSWORD
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agricity-secrets
                  key: RABBITMQ_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agricity-secrets
                  key: JWT_SECRET
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: APP_ENV
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: TZ
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: farmer-service
  namespace: agricity
  labels:
    app.kubernetes.io/name: php-farmer
    app.kubernetes.io/component: farmer-service
spec:
  type: ClusterIP
  selector:
    app: php-farmer
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP


