---
# Deployment OAuth Server (Node.js)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-server
  namespace: agricity
  labels:
    app.kubernetes.io/name: oauth-server
    app.kubernetes.io/component: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: oauth-server
        app.kubernetes.io/name: oauth-server
        app.kubernetes.io/component: auth-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: oauth-server
          image: smart-agri/oauth-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: NODE_ENV
            - name: PORT
              value: "3002"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agricity-secrets
                  key: JWT_SECRET
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: DB_PORT
            - name: DB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: DB_DATABASE
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agricity-secrets
                  key: DB_PASSWORD
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: agricity-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agricity-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_CALLBACK_URL
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: GOOGLE_CALLBACK_URL
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: TZ
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

---
# Service OAuth Server (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: oauth-server-service
  namespace: agricity
  labels:
    app.kubernetes.io/name: oauth-server
    app.kubernetes.io/component: auth-service
spec:
  type: ClusterIP
  selector:
    app: oauth-server
  ports:
    - name: http
      port: 3002
      targetPort: 3002
      protocol: TCP
