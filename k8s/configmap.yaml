apiVersion: v1
kind: ConfigMap
metadata:
  name: agricity-config
  namespace: agricity
  labels:
    app.kubernetes.io/name: smart-agri-city
    app.kubernetes.io/component: config
data:
  # Application 
  NODE_ENV: "production"
  APP_ENV: "production"
  TIMEZONE: "Asia/Jakarta"
  TZ: "Asia/Jakarta"

  # Database (non-sensitive) 
  DB_HOST: "mysql-service.agricity.svc.cluster.local"
  DB_PORT: "3306"
  DB_DATABASE: "agriCity"
  DB_USERNAME: "root"

  # ─ RabbitMQ (non-sensitive) 
  RABBITMQ_HOST: "rabbitmq-service.agricity.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "guest"

  # MQTT / Mosquitto 
  MQTT_BROKER_HOST: "mosquitto-service.agricity.svc.cluster.local"
  MQTT_BROKER_PORT: "1883"
  MQTT_USERNAME: "admin"
  MQTT_CLIENT_ID: "agri_simulator_k8s"
  MQTT_PUBLISH_INTERVAL: "10"

  # Internal Service URLs 
  OAUTH_SERVER_URL: "http://oauth-server-service.agricity.svc.cluster.local:3002"
  FARMER_SERVICE_URL: "http://farmer-service.agricity.svc.cluster.local:8000"
  CROP_SERVICE_URL: "http://crop-service.agricity.svc.cluster.local:8001"
  IRRIGATION_SERVICE_URL: "http://irrigation-service.agricity.svc.cluster.local:8002"
  ML_SERVICE_URL: "http://python-ml-service.agricity.svc.cluster.local:5000"
  PYTHON_ML_URL: "http://python-ml-service.agricity.svc.cluster.local:5000"

  # Port Configuration 
  API_GATEWAY_PORT: "3000"
  OAUTH_SERVER_PORT: "3002"
  FARMER_SERVICE_PORT: "8000"
  CROP_SERVICE_PORT: "8001"
  IRRIGATION_SERVICE_PORT: "8002"
  PYTHON_ML_PORT: "5000"

  #  Google OAuth 
  GOOGLE_CALLBACK_URL: "http://agri.kelompok1.local/oauth/google/callback"