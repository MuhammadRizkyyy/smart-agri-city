global:
  scrape_interval: 15s
  external_labels:
    env: production
    project: smart-agri-city

scrape_configs:
  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]

  - job_name: "php-farmer"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "php-crop"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: "php-irrigation"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8002"]

  - job_name: "python-ml"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5000"]

  - job_name: "rabbitmq"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:15692"]