apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway-vs
  namespace: agricity
  labels:
    app.kubernetes.io/name: api-gateway-vs
    app.kubernetes.io/component: traffic-management
spec:
  hosts:
    - gateway-service.agricity.svc.cluster.local
    - gateway-service
  http:
    - name: canary-routing
      route:
        - destination:
            host: gateway-service.agricity.svc.cluster.local
            subset: stable
            port:
              number: 3000
          weight: 90
        - destination:
            host: gateway-service.agricity.svc.cluster.local
            subset: canary
            port:
              number: 3000
          weight: 10
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,retriable-4xx

