---
# Deployment Python ML Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-ml
  namespace: agricity
  labels:
    app.kubernetes.io/name: python-ml
    app.kubernetes.io/component: ml-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-ml
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: python-ml
        app.kubernetes.io/name: python-ml
        app.kubernetes.io/component: ml-service
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: python-ml
          image: smart-agri/python-ml-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agricity-secrets
                  key: RABBITMQ_PASSWORD
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: agricity-config
                  key: TZ
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

---
# Service Python ML (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: python-ml-service
  namespace: agricity
  labels:
    app.kubernetes.io/name: python-ml
    app.kubernetes.io/component: ml-service
spec:
  type: ClusterIP
  selector:
    app: python-ml
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP