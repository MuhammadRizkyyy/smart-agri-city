name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./express-gateway/package-lock.json"

      - name: Install Node.js dependencies
        run: |
          cd express-gateway
          npm install

      - name: Run Express Gateway Tests
        run: |
          cd express-gateway
          npm run test:ci

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "./python-ml-service/requirements.txt"

      - name: Install Python dependencies
        run: |
          cd python-ml-service
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Generate synthetic training data
        run: |
          cd python-ml-service
          python generate_data.py

      - name: Train ML models (required artifact for tests)
        run: |
          cd python-ml-service
          python train_models.py

      - name: Run Python ML Service Tests
        run: |
          cd python-ml-service
          PYTHONPATH=. pytest tests/ -v --tb=short

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, sockets, amqp
          tools: composer:v2

      - name: Install PHP dependencies (Farmer)
        run: |
          cd php-farmer
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install PHP dependencies (Crop)
        run: |
          cd php-crop
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install PHP dependencies (Irrigation)
        run: |
          cd php-irrigation
          composer install --no-interaction --prefer-dist --optimize-autoloader

  build-push:
    name: Build & Push Docker Images
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./express-gateway
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smart-agri-city-gateway:latest
            ${{ secrets.DOCKER_USERNAME }}/smart-agri-city-gateway:${{ steps.vars.outputs.sha_short }}

      - name: Build and Push OAuth Server
        uses: docker/build-push-action@v5
        with:
          context: ./oauth-server
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smart-agri-city-oauth-server:latest
            ${{ secrets.DOCKER_USERNAME }}/smart-agri-city-oauth-server:${{ steps.vars.outputs.sha_short }}

      - name: Build and Push PHP Farmer
        uses: docker/build-push-action@v5
        with:
          context: ./php-farmer
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smart-agri-city-php-farmer:latest
            ${{ secrets.DOCKER_USERNAME }}/smart-agri-city-php-farmer:${{ steps.vars.outputs.sha_short }}

      - name: Build and Push PHP Crop
        uses: docker/build-push-action@v5
        with:
          context: ./php-crop
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smart-agri-city-php-crop:latest
            ${{ secrets.DOCKER_USERNAME }}/smart-agri-city-php-crop:${{ steps.vars.outputs.sha_short }}

      - name: Build and Push PHP Irrigation
        uses: docker/build-push-action@v5
        with:
          context: ./php-irrigation
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smart-agri-city-php-irrigation:latest
            ${{ secrets.DOCKER_USERNAME }}/smart-agri-city-php-irrigation:${{ steps.vars.outputs.sha_short }}

      - name: Build and Push Python ML
        uses: docker/build-push-action@v5
        with:
          context: ./python-ml-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smart-agri-city-python-ml:latest
            ${{ secrets.DOCKER_USERNAME }}/smart-agri-city-python-ml:${{ steps.vars.outputs.sha_short }}

      - name: Image Summary
        run: |
          echo "## Docker Images Pushed" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| smart-agri-city-gateway | \`latest\`, \`${{ steps.vars.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| smart-agri-city-oauth-server | \`latest\`, \`${{ steps.vars.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| smart-agri-city-php-farmer | \`latest\`, \`${{ steps.vars.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| smart-agri-city-php-crop | \`latest\`, \`${{ steps.vars.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| smart-agri-city-php-irrigation | \`latest\`, \`${{ steps.vars.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| smart-agri-city-python-ml | \`latest\`, \`${{ steps.vars.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY
