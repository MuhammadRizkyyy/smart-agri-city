
apiVersion: v1
kind: Secret
metadata:
  name: agricity-secrets
  namespace: agricity
  labels:
    app.kubernetes.io/name: smart-agri-city
    app.kubernetes.io/component: secrets
  annotations:
    description: "Sensitive credentials — DO NOT commit real values to Git"
type: Opaque
data:
  #  Database Password 
  DB_PASSWORD: "CHANGE_ME_BASE64_ENCODED"

  #  JWT Secret (minimal 32 karakter) 
  JWT_SECRET: "CHANGE_ME_BASE64_ENCODED"

  #  RabbitMQ Password 
  RABBITMQ_PASSWORD: "CHANGE_ME_BASE64_ENCODED"

  #  MySQL Root Password 
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_BASE64_ENCODED"

  #  MQTT Password 
  MQTT_PASSWORD: "CHANGE_ME_BASE64_ENCODED"

  #  Google OAuth
  GOOGLE_CLIENT_ID: "CHANGE_ME_BASE64_ENCODED"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME_BASE64_ENCODED"