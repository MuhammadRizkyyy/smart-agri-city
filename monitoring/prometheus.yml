global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["host.docker.internal:3000"]

  - job_name: "php-farmer"
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "php-crop"
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: "php-irrigation"
    static_configs:
      - targets: ["host.docker.internal:8002"]

  - job_name: "python-ml"
    static_configs:
      - targets: ["host.docker.internal:5000"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["host.docker.internal:15692"]